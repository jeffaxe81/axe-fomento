services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fomento
      POSTGRES_USER: fomento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fomento -d fomento"]
      interval: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fomento:${POSTGRES_PASSWORD}@db:5432/fomento
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET em .env}
      APP_ORIGIN: ${APP_ORIGIN:?Defina APP_ORIGIN com a URL pública do sistema em .env}
      NODE_ENV: production
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    networks: [private]
volumes:
  pgdata:
networks:
  private:
