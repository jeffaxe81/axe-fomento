services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fomento
      POSTGRES_USER: fomento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fomento -d fomento"]
      interval: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
  # Temporary setup service; privileged DB credentials NEVER reach the web service.
  setup:
    profiles: ["setup"]
    build: .
    environment:
      DATABASE_ADMIN_URL: postgresql://fomento:${POSTGRES_PASSWORD}@db:5432/fomento
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?Defina POSTGRES_APP_PASSWORD em .env}
    depends_on:
      db: { condition: service_healthy }
    networks: [private]
  operations:
    profiles: ["operations"]
    build:
      context: .
      dockerfile: Dockerfile.operations
    environment:
      DATABASE_ADMIN_URL: postgresql://fomento:${POSTGRES_PASSWORD}@db:5432/fomento
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Defina BACKUP_ENCRYPTION_KEY em .env}
      BACKUP_DIRECTORY: /backups
      BACKUP_FILE: ${BACKUP_FILE:-}
      RESTORE_TARGET_URL: ${RESTORE_TARGET_URL:-}
      RESTORE_CONFIRMATION: ${RESTORE_CONFIRMATION:-}
    depends_on:
      db: { condition: service_healthy }
    volumes: [backup-data:/backups]
    networks: [private]
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fomento_app:${POSTGRES_APP_PASSWORD:?Defina POSTGRES_APP_PASSWORD em .env}@db:5432/fomento
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET em .env}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Defina MFA_ENCRYPTION_KEY em .env}
      APP_ORIGIN: ${APP_ORIGIN:?Defina APP_ORIGIN com a URL pública do sistema em .env}
      TRUST_PROXY_IP: ${TRUST_PROXY_IP:-false}
      ENABLE_OFFICIAL_SOURCE_SYNC: ${ENABLE_OFFICIAL_SOURCE_SYNC:-no}
      ENABLE_OFFICIAL_CONTRACT_CHECK: ${ENABLE_OFFICIAL_CONTRACT_CHECK:-no}
      ENABLE_PILOT_EVIDENCE: ${ENABLE_PILOT_EVIDENCE:-no}
      ENABLE_PILOT_REVIEW: ${ENABLE_PILOT_REVIEW:-no}
      ENABLE_DOCUMENT_UPLOADS: ${ENABLE_DOCUMENT_UPLOADS:-no}
      ENABLE_EXTERNAL_PROTOCOL_RECORDS: ${ENABLE_EXTERNAL_PROTOCOL_RECORDS:-no}
      ENABLE_DILIGENCE_RECORDS: ${ENABLE_DILIGENCE_RECORDS:-no}
      ENABLE_FINANCIAL_TRACKING: ${ENABLE_FINANCIAL_TRACKING:-no}
      ENABLE_PROJECT_BUDGET: ${ENABLE_PROJECT_BUDGET:-no}
      ENABLE_NORMATIVE_REGISTRY: ${ENABLE_NORMATIVE_REGISTRY:-no}
      ENABLE_MODALITY_MAP: ${ENABLE_MODALITY_MAP:-no}
      ENABLE_EDICT_ASSISTED_EXTRACTION: ${ENABLE_EDICT_ASSISTED_EXTRACTION:-no}
      ENABLE_SEMANTIC_CATALOG: ${ENABLE_SEMANTIC_CATALOG:-no}
      ENABLE_PROPOSAL_DRAFTS: ${ENABLE_PROPOSAL_DRAFTS:-no}
      ENABLE_PROPOSAL_CONTENT_REVIEWS: ${ENABLE_PROPOSAL_CONTENT_REVIEWS:-no}
      ENABLE_FINANCIER_DIRECTORY: ${ENABLE_FINANCIER_DIRECTORY:-no}
      ENABLE_BNDES_CITY_CATALOG: ${ENABLE_BNDES_CITY_CATALOG:-no}
      ENABLE_COFIEX_CATALOG: ${ENABLE_COFIEX_CATALOG:-no}
      ENABLE_INTERNATIONAL_COOPERATION: ${ENABLE_INTERNATIONAL_COOPERATION:-no}
      ENABLE_CONSORTIUMS: ${ENABLE_CONSORTIUMS:-no}
      ENABLE_CONSORTIUM_SHARING: ${ENABLE_CONSORTIUM_SHARING:-no}
      ENABLE_READINESS_EVALUATOR: ${ENABLE_READINESS_EVALUATOR:-no}
      ENABLE_FUNDING_PIPELINE: ${ENABLE_FUNDING_PIPELINE:-no}
      ATTACHMENT_ENCRYPTION_KEY: ${ATTACHMENT_ENCRYPTION_KEY:-}
      NODE_ENV: production
    depends_on:
      db: { condition: service_healthy }
    # Health status is used by "docker compose ps"; proxy remains the only public ingress.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ports: ["127.0.0.1:3000:3000"]
    networks: [private]
volumes:
  pgdata:
  backup-data:
networks:
  private:
